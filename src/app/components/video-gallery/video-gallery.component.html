<div class="row bg-black mt-4">
	<div class="col text-center">
		<section class="video-gallery py-5">
			<div class="container">
				<div *ngIf="loading"
					class="d-flex flex-column align-items-center gap-3 bg-light rounded-4 p-4 text-muted mb-4">
					<div class="spinner-border text-primary" role="status">
						<span class="visually-hidden">Loading...</span>
					</div>
					<p class="mb-0">Loading the latest videos...</p>
				</div>

				<div *ngIf="!loading && errorMessage" class="alert alert-danger" role="alert">
					{{ errorMessage }}
				</div>

				<ng-container *ngIf="!loading && !errorMessage">
					<section class="row g-4 align-items-center mb-5" *ngIf="selectedVideo">
						<div class="col-lg-7">
							<div class="ratio ratio-16x9 rounded-4 overflow-hidden shadow-sm position-relative">
								<iframe #videoIframe [src]="selectedVideoUrl" title="YouTube video player" frameborder="0"
									allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
									style="pointer-events: none;"></iframe>
								<div class="position-absolute top-0 start-0 w-100 h-100 video-overlay">
									<button class="yt-mute-btn position-absolute top-50 start-50 translate-middle"
										(click)="toggleMute()"
										[class.is-muted]="isMuted"
										[attr.aria-label]="isMuted ? 'Unmute video' : 'Mute video'">
										<!-- Unmuted icon -->
										<svg *ngIf="!isMuted" viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg">
											<path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#212121" fill-opacity=".8"/>
											<rect x="17" y="20" width="7" height="8" rx="1" fill="#fff"/>
											<path d="M24 20 L32 14 L32 34 L24 28 Z" fill="#fff"/>
											<path d="M35 19 C37 21 37 27 35 29" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
											<path d="M38 16 C42 19 42 29 38 32" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
										</svg>
										<!-- Muted icon -->
										<svg *ngIf="isMuted" viewBox="0 0 68 48" xmlns="http://www.w3.org/2000/svg">
											<path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="#c00" fill-opacity=".8"/>
											<rect x="17" y="20" width="7" height="8" rx="1" fill="#fff"/>
											<path d="M24 20 L32 14 L32 34 L24 28 Z" fill="#fff"/>
											<line x1="36" y1="18" x2="45" y2="30" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
											<line x1="45" y1="18" x2="36" y2="30" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
										</svg>
									</button>
								</div>
							</div>
						</div>
						<div class="col-lg-5 text-lg-end text-white">
							<p class="text-uppercase text-primary fw-semibold small mb-2">Now Playing</p>
							<h3 class="h2">{{ selectedVideo.title }}</h3>
							<p class="text-primary mb-3" *ngIf="selectedVideo.publishedAt">
								{{ selectedVideo.publishedAt | date: 'MMM d, y' }}
							</p>
							<p class="d-none d-xl-block" *ngIf="selectedVideo.description">
								{{ selectedVideo.description }}
							</p>
						</div>
					</section>

					<div class="video-carousel d-flex flex-nowrap gap-3 overflow-auto pb-2"
						aria-label="Video gallery carousel">
						<article class="flex-shrink-0" *ngFor="let video of videos; trackBy: trackByVideoId">
							<div class="video-card card h-100 border shadow-sm" (click)="selectVideo(video)"
								(keyup.enter)="selectVideo(video)" (keyup.space)="selectVideo(video)" tabindex="0"
								role="button" [class.border-primary]="video.id === selectedVideo?.id"
								[class.border-2]="video.id === selectedVideo?.id"
								[class.shadow-lg]="video.id === selectedVideo?.id">
								<div class="ratio ratio-16x9 bg-light rounded-top position-relative overflow-hidden">
									<img [src]="video.thumbnail" [alt]="video.title" loading="lazy"
										class="w-100 h-100 object-fit-cover" />

								</div>
								<div class="card-body">
									<h4 class="h6 mb-2">{{ video.title }}</h4>
									<p class="small mb-0" *ngIf="video.publishedAt">
										{{ video.publishedAt | date: 'MMM d, y' }}
									</p>
								</div>
							</div>
						</article>
					</div>
				</ng-container>
			</div>
		</section>
	</div>
</div>
